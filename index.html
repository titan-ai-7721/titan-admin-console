<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TITAN 云端管理后台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡</text></svg>">
<link rel="manifest" href='data:application/manifest+json,{"name":"TITAN云端管理后台","short_name":"TITAN后台","display":"standalone","icons":[]}'>
<style>
:root{--bg:#0b0f17;--panel:#121826;--panel2:#0f1521;--line:#202a3c;--txt:#d7e0ee;--mut:#7d8aa3;--red:#e5484d;--grn:#3fa66e;--amber:#d9a441;--blue:#4c86d6;--accent:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:200px;background:var(--panel2);border-right:1px solid var(--line);padding:16px 10px;flex-shrink:0}
.brand{font-weight:700;font-size:16px;padding:6px 10px 16px;color:#fff;letter-spacing:1px}
.brand small{display:block;color:var(--mut);font-weight:400;font-size:11px;margin-top:2px}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;font-size:14px}
.nav button:hover{background:var(--panel);color:var(--txt)}
.nav button.on{background:var(--accent);color:#fff}
.main{flex:1;min-width:0;padding:20px 24px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.hdr h2{margin:0;font-size:18px}
.who{color:var(--mut);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--panel)}
tbody tr:hover{background:var(--panel2)}
.tbl-wrap{overflow:auto;max-height:60vh}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat-card .num{font-size:24px;font-weight:700;margin-top:4px}
.stat-card .lbl{color:var(--mut);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.b-on{background:rgba(63,166,110,.18);color:var(--grn)}
.b-off{background:rgba(125,138,163,.18);color:var(--mut)}
.b-stopped{background:rgba(229,72,77,.18);color:var(--red)}
.b-frozen{background:rgba(217,164,65,.18);color:var(--amber)}
.b-crit{background:rgba(229,72,77,.18);color:var(--red)}
.b-warn{background:rgba(217,164,65,.18);color:var(--amber)}
.b-info{background:rgba(76,134,214,.18);color:var(--blue)}
.b-disabled{background:rgba(125,138,163,.25);color:var(--mut)}
button.btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
button.btn:hover{border-color:var(--mut)}
button.btn.red{background:var(--red);border-color:var(--red);color:#fff}
button.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}
button.btn.amber{background:var(--amber);border-color:var(--amber);color:#1a1a1a}
button.btn.sm{padding:4px 8px;font-size:12px;margin:1px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit}
label{display:block;color:var(--mut);margin:10px 0 5px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>.f{flex:1;min-width:120px}
.ops{display:flex;gap:5px;flex-wrap:wrap}
.login-wrap{max-width:420px;margin:7vh auto}
.muted{color:var(--mut)}.center{text-align:center}.mt{margin-top:14px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);padding:12px 16px;border-radius:10px;max-width:360px;display:none;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.err{border-left-color:var(--red)}
.toast.ok{border-left-color:var(--grn)}
.codebox{font-family:Consolas,monospace;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;font-size:12px}
.checkbox{width:auto;display:inline-block;margin-right:6px}
@media(max-width:760px){.app{flex-direction:column}.side{width:100%;padding:8px}.brand{padding:4px 8px}.nav{display:flex}.nav button{width:auto;white-space:nowrap}.main{padding:14px}th,td{padding:7px 6px}}
</style>
</head>
<body>
<div class="app" id="app" style="display:none">
  <aside class="side">
    <div class="brand">TITAN 云端后台<small>设备监控与分级授权</small></div>
    <nav class="nav" id="nav">
      <button data-page="dashboard" data-admin="1">数据报表</button>
      <button data-page="devices" class="on">设备监控</button>
      <button data-page="security">安全事件</button>
      <button data-page="codes">卡密管理</button>
      <button data-page="customers">客户管理</button>
      <button data-page="dealers" data-admin="1">经销商管理</button>
      <button data-page="audit">审计日志</button>
      <button data-page="settings">设置</button>
    </nav>
  </aside>
  <main class="main">
    <div class="hdr"><h2 id="pageTitle">设备监控</h2>
      <div class="who"><span id="whoEmail"></span> <button class="btn sm" onclick="doLogout()">退出登录</button></div>
    </div>
    <div id="pageBody"></div>
  </main>
</div>

<div class="login-wrap" id="loginWrap">
  <div class="card">
    <div class="center" style="font-size:26px">🛡</div>
    <h2 class="center" style="margin:6px 0 18px">TITAN 云端管理后台</h2>
    <label>邮箱</label><input id="liEmail" type="email" placeholder="管理员/代理邮箱">
    <label>密码</label><input id="liPass" type="password" placeholder="登录密码">
    <button class="btn red mt" style="width:100%" onclick="doLogin()">登录</button>
  </div>
</div>
<div class="toast" id="toast"></div>

/* ---------- 编码工具 ---------- */
function hexToBytes(h){h=h.trim();var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
function b64url(bytes){var s="",A="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";var b=0,v=0;for(var i=0;i<bytes.length;i++){v=(v<<8)|bytes[i];b+=8;while(b>=6){s+=A[(v>>>(b-6))&63];b-=6;}}if(b>0)s+=A[(v<<(6-b))&63];return s;}
function stableStringify(o){
  if(o===null||typeof o!=="object")return JSON.stringify(o);
  if(Array.isArray(o))return "["+o.map(stableStringify).join(",")+"]";
  var keys=Object.keys(o).sort();return "{"+keys.map(function(k){return JSON.stringify(k)+":"+stableStringify(o[k]);}).join(",")+"}";
}
function uuid(){if(crypto.randomUUID)return crypto.randomUUID();var b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&0x3f|0x40;b[8]=b[8]&0x3f|0x80;var h=[];for(var i=0;i<16;i++)h.push(b[i].toString(16).padStart(2,"0"));return h.slice(0,4).join("")+"-"+h.slice(4,6).join("")+"-"+h.slice(6,8).join("")+"-"+h.slice(8,10).join("")+"-"+h.slice(10,16).join("");}
function parseJwt(t){try{return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));}catch(e){return {};}}

/* ---------- HTTP ---------- */
function api(path,opt){opt=opt||{};var c=cfg();opt.headers=opt.headers||{};opt.headers.apikey=c.anon;if(c.token)opt.headers.Authorization="Bearer "+c.token;return fetch(c.url+path,opt).then(function(r){if(r.status===401){doLogout();throw new Error("登录已失效，请重新登录");}return r.text().then(function(t){var d=t?JSON.parse(t):null;if(!r.ok)throw new Error((d&&(d.message||d.error)||("请求失败 "+r.status)));return d;});});}
function restGet(table,query){return api("/rest/v1/"+table+(query?"?"+query:""));}
function rpc(name,body){return api("/rest/v1/rpc/"+name,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});}

/* ---------- 签名 ---------- */
function buildSigned(command){
  var seed=get(LS.seed);if(!seed)throw new Error("请先在设置中填入 Ed25519 签名私钥");
  var idem=uuid(),payload={};
  var canon=[PRODUCT,command,idem,stableStringify(payload)].join("|");
  var kp=nacl.sign.keyPair.fromSeed(hexToBytes(seed));
  var sig=nacl.sign.detached(new TextEncoder().encode(canon),kp.secretKey);
  return {p_command:command,p_payload:payload,p_idempotency_key:idem,p_signature:b64url(sig)};
}
function issueSigned(deviceId,command){
  var s;try{s=buildSigned(command);}catch(e){toast(e.message,"err");return Promise.reject(e);}
  s.p_device_id=deviceId;
  return rpc("fn_admin_issue_command",s).then(function(){toast("已下发签名指令："+command,"ok");showPage(curPage);}).catch(function(e){toast(e.message,"err");});
}

    rows.forEach(function(r){h+='<tr><td>'+fmtTime(r.ts)+'</td><td style="font-size:12px">'+esc(r.actor)+'</td><td>'+esc(r.action)+'</td><td class="muted" style="font-size:12px">'+esc(stableStringify(r.detail))+'</td></tr>';});
    h+='</tbody></table></div></div>';document.getElementById("pageBody").innerHTML=h;
  }).catch(function(e){document.getElementById("pageBody").innerHTML='<div class="card muted">加载失败：'+esc(e.message)+'</div>';});
}

/* ---------- 设置 ---------- */
function pageSettings(){
  var h='<div class="card"><label>Ed25519 指令签名私钥（hex，仅存本机浏览器，不写入云端）</label><textarea id="stSeed" rows="2">'+esc(get(LS.seed))+'</textarea>'
    +'<button class="btn red mt" onclick="set(LS.seed,document.getElementById(\'stSeed\').value.trim());toast(\'签名私钥已保存\',\'ok\')">保存私钥</button>'
    +'<p class="muted mt" style="font-size:12px">与 PC 签发器、手机注册器同一把；云端数据库不存储私钥。</p></div>';
  if(ME.role==="admin"){
    restGet("app_settings","select=*").then(function(rows){
      var m={};rows.forEach(function(r){m[r.key]=r.value;});
      var h2='<div class="card"><h3 style="margin:0 0 8px">设备数量限制（防注册码超量）</h3><div class="row">'
        +'<div class="f"><label>每客户最多设备数</label><input id="setPer" type="number" value="'+esc(m.max_devices_per_customer)+'"></div>'
        +'<div class="f"><label>全局设备总数上限</label><input id="setGlobal" type="number" value="'+esc(m.max_devices_global)+'"></div>'
        +'<div class="f"><button class="btn red" onclick="saveLimits()">保存限制</button></div></div></div>';
      document.getElementById("pageBody").insertAdjacentHTML("beforeend",h2);
    }).catch(function(){});
  }
  document.getElementById("pageBody").innerHTML=h;
}
function saveLimits(){
  var per=document.getElementById("setPer").value,glo=document.getElementById("setGlobal").value;
  api("/rest/v1/app_settings?key=eq.max_devices_per_customer",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({value:parseInt(per)})})
  .then(function(){return api("/rest/v1/app_settings?key=eq.max_devices_global",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({value:parseInt(glo)})});})
  .then(function(){toast("设备数量限制已保存","ok");}).catch(function(e){toast(e.message,"err");});
}

var autoTimer=null;
function setupAuto(){clearInterval(autoTimer);autoTimer=setInterval(function(){if(curPage==="devices"){pageDevices();}},30000);}
function showPage(p){navOn(p);curPage=p;({dashboard:pageDashboard,devices:pageDevices,security:pageSecurity,codes:pageCodes,customers:pageCustomers,dealers:pageDealers,audit:pageAudit,settings:pageSettings}[p])();}

/* ---------- 启动 ---------- */
(function(){
  if(get(LS.token)){enterApp();}
  else{document.getElementById("loginWrap").style.display="block";}
})();
</script>
